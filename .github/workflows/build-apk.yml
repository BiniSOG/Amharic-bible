name: Build Android & iOS

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      # Android App Bundle for the Google Play Store.
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: amharic-bible-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: amharic-bible-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Pushing a tag such as v1.1.0 publishes a GitHub Release.
      # version.json points users there when an update is available/required.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      # Builds without code signing. The IPA must be signed with an Apple
      # account before it can be installed (see README).
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr ../AmharicBible-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: amharic-bible-ios-unsigned-ipa
          path: build/AmharicBible-unsigned.ipa
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/AmharicBible-unsigned.ipa
